name: team-checks

# Fork only. Replaces team-pr-label-check. The rules and their checks: rl/tools/ (check_pr.py, check_docs.py,
# check_data.py, scrub_check.py, upstream_ready.sh) and their fixtures in rl/tools/tests/.
#   F1  label derived from the base and the changed paths   required (fails the job); runs the rl/tools directory
#       that the BASE commit holds, so a pull request cannot loosen the rule it is judged by. Only check_pr.py and
#       common.py are copied from it into an empty directory and run with python -I, so no other file of that folder
#       can shadow a standard-library module. Main is named by one sha, resolved from refs/remotes/origin/main.
#       Precondition of that sentence: .github/workflows/ and all of rl/tools/ are lead-only in
#       .github/CODEOWNERS, and the repository setting "require review from Code Owners" is on (the lead sets it; while
#       it is off, the protection is only a convention).
#       When the base holds no rl/tools: base main at the main bootstrap commit (this pull request itself) runs the pull
#       request's own copy; base integration at the integration bootstrap commit runs the rl/tools of the fork's main
#       (fetched below; F1 fails when main cannot be read or has none); any other base of main or integration fails F1.
#       A base that is neither main nor integration keeps the old label rule, judged by the pull request's own copy.
#       A pull request into integration that changes a team path must be a sync from main: every team path at the head
#       equals main (rl/tools/check_pr.py, sync rule).
#   F9  selftests of the tools                              required (fails the job)
#   F2-F8, F10                                              fail the job "F2-F8 and F10" on every base (each check is run, and
#       every failure is printed). Report mode (a warning) only for two checks, and only for base integration, because a
#       pristine integration is red on them for reasons outside a pull request's control:
#         F5 switches: README.md is a team path that must equal main (sync rule), and its switches block describes main's
#           code, while integration adds switches. Green once integration's switches equal main's, or once the block
#           names a branch per row for integration.
#         F10: two engine files of integration mention rl/ (sglang_neuron/rlkit_sampler_topk.py, tests/rlkit_sampler/README.md).
#           Green once a cpu-only engine pull request into integration removes those mentions. A mention or symlink
#           that the base does not already have still fails on integration (check_docs.py f10 --base).
#       F3 scrubs every changed file that still exists (engine files too), with rl/tools/scrub_allow.txt.
# F5 (generated blocks) runs best.py, switches.py and check_tables.py in that job. A document without the markers is
# reported as not checked and passes; rl/tools/tests/test_docs_pr.py (F9) requires the markers in README.md and RESULTS.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  f1-label-rule:
    name: F1 label rule
    if: github.repository == 'pengchenglu1997/sglang-neuron'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch main for the sync rule
        # The checkout holds the whole history, so this only brings main's current tip (the public repository needs no credentials).
        # The commit is resolved once, from the full ref name, and every later step uses that sha: the short name origin/main
        # would also match a tag of that name (refs/tags wins over refs/remotes).
        run: |
          set -eu
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_sha=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
          echo "main is $main_sha"
          echo "MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
      - name: F1 label from base and paths
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Bootstrap commits: the only bases without rl/tools whose pull request may run its own copy of the checker.
          BOOT_MAIN=297c35cae629a3fe4fe9d04ada2ec8a84487ecfd
          BOOT_INTEGRATION=749704d8d9c57b67bb61e5ed38c769b0815dcaac
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/paths.z"
          f1dir="$RUNNER_TEMP/f1-from-base"
          rm -rf "$f1dir"; mkdir -p "$f1dir"
          if git cat-file -e "$BASE_SHA:rl/tools/check_pr.py" 2>/dev/null && git cat-file -e "$BASE_SHA:rl/tools/common.py" 2>/dev/null; then
            git archive "$BASE_SHA" rl/tools | (cd "$f1dir" && tar -x)
            echo "F1 runs the rl/tools directory of the base commit"
          else
            if [ "$BASE_REF" = main ] && [ "$BASE_SHA" = "$BOOT_MAIN" ]; then
              # Only this pull request (it adds rl/tools to main) may be judged by its own copy.
              mkdir -p "$f1dir/rl"
              cp -R rl/tools "$f1dir/rl/tools"
              echo "the base is the main bootstrap commit without rl/tools: F1 runs the pull request's own copy"
            elif [ "$BASE_REF" = integration ] && [ "$BASE_SHA" = "$BOOT_INTEGRATION" ]; then
              # Never the pull request's copy: it would judge itself. Use the checker that main holds.
              if [ -n "${MAIN_SHA:-}" ] && git cat-file -e "$MAIN_SHA:rl/tools/check_pr.py" 2>/dev/null && git cat-file -e "$MAIN_SHA:rl/tools/common.py" 2>/dev/null; then
                git archive "$MAIN_SHA" rl/tools | (cd "$f1dir" && tar -x)
                echo "the base is the integration bootstrap commit without rl/tools: F1 runs the rl/tools directory of main"
              else
                echo "::error::F1: the integration bootstrap base holds no rl/tools and main (${MAIN_SHA:-unresolved}) could not be read or holds none either. F1 fails."
                exit 1
              fi
            elif [ "$BASE_REF" = main ] || [ "$BASE_REF" = integration ]; then
              echo "::error::F1: base $BASE_SHA of $BASE_REF holds no rl/tools and is not a bootstrap commit. The tools must exist at the base; merge main into the base first."
              exit 1
            else
              mkdir -p "$f1dir/rl"
              cp -R rl/tools "$f1dir/rl/tools"
              echo "the base ref $BASE_REF is outside the team rule (old label rule only): F1 runs the pull request's own copy"
            fi
          fi
          # Run only check_pr.py and common.py, from a fresh directory, in isolated mode: a file of the base tools folder
          # (json.py, re.py ...) cannot shadow a standard-library module, and PYTHON* variables are ignored.
          f1run="$RUNNER_TEMP/f1-run"
          rm -rf "$f1run"; mkdir -p "$f1run"
          cp "$f1dir/rl/tools/check_pr.py" "$f1dir/rl/tools/common.py" "$f1run/"
          echo "base=$BASE_REF labels=$LABELS_JSON changed paths=$(tr -cd '\0' < "$RUNNER_TEMP/paths.z" | wc -c)"
          python -I "$f1run/check_pr.py" f1 --base "$BASE_REF" --labels-json "$LABELS_JSON" --paths-file "$RUNNER_TEMP/paths.z" \
            --head "$HEAD_SHA" --main "${MAIN_SHA:-}" \
            || { echo "::error::F1: label rule failed. See AGENTS.md section 3 and rl/tools/check_pr.py."; exit 1; }

  f9-selftests:
    name: F9 selftests
    if: github.repository == 'pengchenglu1997/sglang-neuron'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tool tests (fixtures, replay of pull requests 3, 13 and 15, upstream_ready.sh)
        run: python -m unittest discover -s rl/tools/tests -p 'test_*.py' -v
      - name: rl/selftest_*.py (none before the import of rl/)
        run: |
          set -eu
          n=0
          for f in rl/selftest_*.py; do
            [ -e "$f" ] || continue
            n=$((n + 1))
            echo "== $f"
            python "$f"
          done
          echo "selftest scripts run: $n"

  checks:
    name: F2-F8 and F10
    if: github.repository == 'pengchenglu1997/sglang-neuron'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch main for F2
        run: |
          set -eu
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          echo "MAIN_SHA=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')" >> "$GITHUB_ENV"
      - name: Team checks F2-F8 and F10 (any failing check fails the job)
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # set -e: a failing git or classify step stops the job. A check run by step() does not stop the others: every
          # failure is printed, and the job fails at the end.
          set -eu
          T=rl/tools
          fail=0
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/paths.z"
          git diff --name-only -z --no-renames --diff-filter=d "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed_alive.z"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          step() { name="$1"; shift; echo "::group::$name"; if "$@"; then echo "$name: ok"; else echo "::error::$name failed"; fail=1; fi; echo "::endgroup::"; }
          # integration_report: report mode for base integration only (the reasons: the header of this file); on every
          # other base it is step, so a failure fails the job.
          integration_report() {
            if [ "$BASE_REF" != integration ]; then step "$@"; return; fi
            name="$1"; shift; echo "::group::$name"
            if "$@"; then echo "$name: ok"; else echo "::warning::$name failed; report mode for base integration only (see the header of team-checks.yml)"; fi
            echo "::endgroup::"
          }
          step "F2 hardware evidence" python $T/check_pr.py f2 --labels-json "$LABELS_JSON" --paths-file "$RUNNER_TEMP/paths.z" --body-file "$RUNNER_TEMP/body.txt" --head "$HEAD_SHA" --main "$MAIN_SHA"
          step "F3 scrub of every changed file" python $T/scrub_check.py --files-from-0 "$RUNNER_TEMP/changed_alive.z" --allow $T/scrub_allow.txt
          step "F4 public CPU lint" python $T/check_docs.py f4 --base "$BASE_SHA"
          # F5: best.tsv rows and the best blocks; the switches table and the default-on exception list (only where the
          # base is main or integration, diffed against upstream-main); make_tables.py output against tables.txt.
          # A document without a generated block is reported as not checked (test_docs_pr.py requires the markers).
          step "F5 best.tsv and best blocks" python $T/best.py --check README.md docs/rl/RESULTS.md
          if [ "$BASE_REF" = main ] || [ "$BASE_REF" = integration ]; then
            integration_report "F5 switches" python $T/switches.py --check README.md --base origin/upstream-main --branch "HEAD=$BASE_REF"
          else
            echo "F5 switches: not checked, the base $BASE_REF is neither main nor integration"
          fi
          step "F5 tables.txt against make_tables.py" python $T/check_tables.py
          step "F6 data folders" python $T/check_data.py --base "$BASE_SHA" --head "$HEAD_SHA"
          step "F7 links and paths" python $T/check_docs.py f7 --base "$BASE_SHA"
          step "F8 state wording on added lines" python $T/check_docs.py f8 --base "$BASE_SHA" --head "$HEAD_SHA"
          # On integration a mention or symlink that the base does not already have fails; only the known ones are reported.
          if [ "$BASE_REF" = integration ]; then
            step "F10 no new rl/ mention or symlink against the base" python $T/check_docs.py f10 --base "$BASE_SHA"
          fi
          integration_report "F10 engine files do not mention rl/ and symlinks" python $T/check_docs.py f10
          # Every other check fails the job on every base.
          exit "$fail"
