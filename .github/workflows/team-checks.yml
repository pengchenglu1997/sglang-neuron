name: team-checks

# Fork only. Replaces team-pr-label-check. The rules and their checks: rl/tools/ (check_pr.py, check_docs.py,
# check_data.py, scrub_check.py, upstream_ready.sh) and their fixtures in rl/tools/tests/.
#   F1  label derived from the base and the changed paths   required (fails the job); runs the rl/tools directory
#       that the BASE commit holds, so a pull request cannot loosen the rule it is judged by.
#       Precondition of that sentence: .github/workflows/ and check_pr.py, common.py and the fixtures are lead-only in
#       .github/CODEOWNERS, and the repository setting "require review from Code Owners" is on (the lead sets it; while
#       it is off, the protection is only a convention).
#       When the base holds no rl/tools, the pull request's own copy runs only if the base commit is one of the two
#       bootstrap commits below (main before the tools existed, and the tip of integration when this was written).
#       Any other base of main or integration without the tools fails F1.
#       A pull request into integration that changes a team path must be a sync from main: every team path at the head
#       equals main (rl/tools/check_pr.py, sync rule).
#   F9  selftests of the tools                              required (fails the job)
#   F2-F8, F10                                              report mode: printed as warnings, the job never fails
# F5 (generated blocks) has no tool yet: best.py and switches.py arrive with rl/best.tsv.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  f1-label-rule:
    name: F1 label rule
    if: github.repository == 'pengchenglu1997/sglang-neuron'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch main for the sync rule
        # The checkout holds the whole history, so this only brings main's current tip (the public repository needs no credentials).
        run: |
          set -eu
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
      - name: F1 label from base and paths
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_REF: origin/main
        run: |
          set -eu
          # Bootstrap commits: the only bases without rl/tools whose pull request may run its own copy of the checker.
          BOOT_MAIN=297c35cae629a3fe4fe9d04ada2ec8a84487ecfd
          BOOT_INTEGRATION=749704d8d9c57b67bb61e5ed38c769b0815dcaac
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/paths.z"
          f1dir="$RUNNER_TEMP/f1-from-base"
          rm -rf "$f1dir"; mkdir -p "$f1dir"
          if git cat-file -e "$BASE_SHA:rl/tools/check_pr.py" 2>/dev/null && git cat-file -e "$BASE_SHA:rl/tools/common.py" 2>/dev/null; then
            git archive "$BASE_SHA" rl/tools | (cd "$f1dir" && tar -x)
            echo "F1 runs the rl/tools directory of the base commit"
          else
            case "$BASE_SHA" in
              "$BOOT_MAIN"|"$BOOT_INTEGRATION") bootstrap=1 ;;
              *) bootstrap=0 ;;
            esac
            if [ "$bootstrap" = 1 ]; then
              mkdir -p "$f1dir/rl"
              cp -R rl/tools "$f1dir/rl/tools"
              echo "the base is a bootstrap commit without rl/tools: F1 runs the pull request's own copy"
            elif [ "$BASE_REF" = main ] || [ "$BASE_REF" = integration ]; then
              echo "::error::F1: base $BASE_SHA of $BASE_REF holds no rl/tools and is not a bootstrap commit. The tools must exist at the base; merge main into the base first."
              exit 1
            else
              mkdir -p "$f1dir/rl"
              cp -R rl/tools "$f1dir/rl/tools"
              echo "the base ref $BASE_REF is outside the team rule (old label rule only): F1 runs the pull request's own copy"
            fi
          fi
          echo "base=$BASE_REF labels=$LABELS_JSON changed paths=$(tr -cd '\0' < "$RUNNER_TEMP/paths.z" | wc -c)"
          python "$f1dir/rl/tools/check_pr.py" f1 --base "$BASE_REF" --labels-json "$LABELS_JSON" --paths-file "$RUNNER_TEMP/paths.z" \
            --head "$HEAD_SHA" --main "$MAIN_REF" \
            || { echo "::error::F1: label rule failed. See AGENTS.md rule 6 and rl/tools/check_pr.py."; exit 1; }

  f9-selftests:
    name: F9 selftests
    if: github.repository == 'pengchenglu1997/sglang-neuron'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tool tests (fixtures, replay of pull requests 3, 13 and 15, upstream_ready.sh)
        run: python -m unittest discover -s rl/tools/tests -p 'test_*.py' -v
      - name: rl/selftest_*.py (none before the import of rl/)
        run: |
          set -eu
          n=0
          for f in rl/selftest_*.py; do
            [ -e "$f" ] || continue
            n=$((n + 1))
            echo "== $f"
            python "$f"
          done
          echo "selftest scripts run: $n"

  report:
    name: F2-F8 and F10 report
    if: github.repository == 'pengchenglu1997/sglang-neuron'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Report-mode checks (printed, never failing)
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # set -e: a failing git or classify step stops the job; it must never end in "ok". Only the checks run by
          # step() below are report mode.
          set -eu
          T=rl/tools
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/paths.z"
          git diff --name-only -z --no-renames --diff-filter=d "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed_alive.z"
          python $T/check_pr.py classify --kind team -z < "$RUNNER_TEMP/changed_alive.z" > "$RUNNER_TEMP/team_files.z"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          step() { name="$1"; shift; echo "::group::$name"; if "$@"; then echo "$name: ok"; else echo "::warning::$name would fail (report mode)"; fi; echo "::endgroup::"; }
          step "F2 hardware evidence" python $T/check_pr.py f2 --labels-json "$LABELS_JSON" --paths-file "$RUNNER_TEMP/paths.z" --body-file "$RUNNER_TEMP/body.txt" --head "$HEAD_SHA" --main origin/main
          step "F3 scrub of changed team files" python $T/scrub_check.py --files-from-0 "$RUNNER_TEMP/team_files.z" --allow $T/scrub_allow.txt
          step "F4 public CPU lint" python $T/check_docs.py f4 --base "$BASE_SHA"
          if [ -e $T/best.py ]; then
            step "F5 generated blocks" python $T/best.py --check README.md docs/rl/RESULTS.md
          else
            echo "F5 generated blocks: not checked, rl/tools/best.py and switches.py do not exist yet"
          fi
          step "F6 data folders" python $T/check_data.py --base "$BASE_SHA" --head "$HEAD_SHA"
          step "F7 links and paths" python $T/check_docs.py f7 --base "$BASE_SHA"
          step "F8 state wording on added lines" python $T/check_docs.py f8 --base "$BASE_SHA" --head "$HEAD_SHA"
          step "F10 engine files do not mention rl/ and symlinks" python $T/check_docs.py f10
          exit 0
